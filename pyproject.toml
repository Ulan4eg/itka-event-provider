[project]
name = "events-aggregator"
version = "0.1.0"
description = "Aggregator service on top of the Events Provider API"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "celery>=5.4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "requests>=2.32",
    "dj-database-url>=2.2",
    "gunicorn>=22.0",
    "tzdata>=2024.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W - pycodestyle (PEP8), F - pyflakes, I - isort, B - bugbear
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "src.core.settings"
pythonpath = ["."]
testpaths = ["tests"]
